- name: Find and prepare APK
  run: |
    mkdir -p release

    echo "=== APK files ==="
    find app/build/outputs/apk -type f -name "*.apk" -print

    APK=$(find app/build/outputs/apk -type f -name "*.apk" | head -n 1)

    if [ -z "$APK" ]; then
      echo "ERROR: APK topilmadi!"
      exit 1
    fi

    echo "Found APK: $APK"
    cp "$APK" release/BirZum24.apk

    echo "=== Release files ==="
    ls -lah release
