name: Build BirZum24 Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build APK and AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Check Android environment
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -la "$ANDROID_HOME" || true

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Clean project
        run: ./gradlew clean --stacktrace

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Build Release AAB
        run: ./gradlew bundleRelease --stacktrace

      - name: Find APK and AAB
        run: |
          echo "===== APK ====="
          find . -type f -name "*.apk" -print

          echo "===== AAB ====="
          find . -type f -name "*.aab" -print

      - name: Prepare release
        run: |
          mkdir -p release

          APK=$(find app/build/outputs/apk -type f -name "*.apk" | head -n 1)
          AAB=$(find app/build/outputs/bundle -type f -name "*.aab" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK topilmadi!"
            echo "APK build papkasini tekshirish:"
            find app/build/outputs -type f -print || true
            exit 1
          fi

          if [ -z "$AAB" ]; then
            echo "ERROR: AAB topilmadi!"
            echo "AAB build papkasini tekshirish:"
            find app/build/outputs -type f -print || true
            exit 1
          fi

          cp "$APK" release/BirZum24.apk
          cp "$AAB" release/BirZum24.aab

          echo "===== RELEASE ====="
          ls -lah release

      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: BirZum24-release
          path: release/
          if-no-files-found: error
