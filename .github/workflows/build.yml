name: Build BirZum24 Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build APK and AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Build Release APK
        run: gradle assembleRelease --stacktrace

      - name: Build Release AAB
        run: gradle bundleRelease --stacktrace

      - name: Find generated APK and AAB
        run: |
          echo "===== APK ====="
          find app/build/outputs/apk -type f -name "*.apk" -print || true

          echo "===== AAB ====="
          find app/build/outputs/bundle -type f -name "*.aab" -print || true

      - name: Prepare release files
        run: |
          mkdir -p release

          APK=$(find app/build/outputs/apk -type f -name "*.apk" | head -n 1)
          AAB=$(find app/build/outputs/bundle -type f -name "*.aab" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK topilmadi!"
            find app/build/outputs -type f -print || true
            exit 1
          fi

          if [ -z "$AAB" ]; then
            echo "ERROR: AAB topilmadi!"
            find app/build/outputs -type f -print || true
            exit 1
          fi

          echo "APK topildi: $APK"
          echo "AAB topildi: $AAB"

          cp "$APK" release/BirZum24.apk
          cp "$AAB" release/BirZum24.aab

          echo "===== RELEASE FILES ====="
          ls -lah release

      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: BirZum24-release
          path: release/
          if-no-files-found: error
