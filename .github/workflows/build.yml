name: Build BirZum24 APK AAB


on:

  workflow_dispatch:

  push:

    branches:

      - main



jobs:

  build:

    runs-on: ubuntu-latest


    steps:


      # --------------------------------
      # 1. SOURCE CODE
      # --------------------------------

      - name: Checkout

        uses: actions/checkout@v4



      # --------------------------------
      # 2. JAVA 17
      # --------------------------------

      - name: Set up JDK 17

        uses: actions/setup-java@v4

        with:

          distribution: temurin

          java-version: '17'



      # --------------------------------
      # 3. GRADLE 8.7
      # --------------------------------

      - name: Install Gradle 8.7

        run: |

          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip

          sudo mkdir -p /opt/gradle

          sudo unzip -q gradle-8.7-bin.zip -d /opt/gradle

          echo "/opt/gradle/gradle-8.7/bin" >> $GITHUB_PATH



      # --------------------------------
      # 4. GRADLE WRAPPER
      # --------------------------------

      - name: Generate Gradle Wrapper

        run: |

          gradle wrapper --gradle-version 8.7



      # --------------------------------
      # 5. BUILD APK + AAB
      # --------------------------------

      - name: Build APK and AAB

        run: |

          chmod +x gradlew

          ./gradlew clean assembleRelease bundleRelease



      # --------------------------------
      # 6. RENAME
      # --------------------------------

      - name: Prepare release files

        run: |

          mkdir -p release

          cp app/build/outputs/apk/release/app-release.apk release/BirZum24.apk

          cp app/build/outputs/bundle/release/app-release.aab release/BirZum24.aab



      # --------------------------------
      # 7. UPLOAD
      # --------------------------------

      - name: Upload APK and AAB

        uses: actions/upload-artifact@v4

        with:

          name: BirZum24-release

          path: release/
